[package]
name = "fileport-app"
version = "0.2.3"
description = "file/port — Dateitransfer für jedes Protokoll"
edition = "2021"
license = "MIT"

[[bin]]
name = "fileport"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fileport-core = { version = "0.1.5", path = "../core" }
tokio = { version = "1.53.1", features = ["sync", "rt", "macros"] }
keyring = { version = "4.1.6", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
