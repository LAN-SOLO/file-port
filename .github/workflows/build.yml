name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: 'app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: 'app,dmg'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: 'msi,nsis'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: 'deb,rpm,appimage'
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    # ein hängender apt-Mirror hat v0.2.5 6h blockiert — hart deckeln
    # macOS: Apples Notary-Dienst brauchte am 2026-09-19 55 min für eine App —
    # Notarisierung von .app + DMG passt nicht in 60 min, daher 180 für macOS.
    timeout-minutes: ${{ startsWith(matrix.platform, 'macos') && 180 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install

      # tauri::generate_context! braucht ../dist zur Compile-Zeit — daher
      # das Frontend schon vor den Tests bauen (tauri build baut es erneut).
      - name: Build frontend
        run: pnpm build

      - name: Run tests
        run: cargo test --workspace

      # Das AppImage-Bundling lädt linuxdeploy & Co. anonym von GitHub und
      # läuft auf Shared-Runnern gern in 429-Rate-Limits: Tooling cachen
      # und den Build bei Fehlschlag mit Wartezeit wiederholen.
      - name: Cache AppImage tooling
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: appimage-tools-${{ runner.os }}

      # Apple-Signatur + Notarisierung (nur macOS, nur wenn die Secrets gesetzt sind).
      # Tauri liest APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY und die App-Store-Connect-API-Daten selbst und
      # signiert/notarisiert die .app beim Build; die DMG notarisieren wir danach.
      - name: Prepare Apple signing
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}"
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple/AuthKey.p8"
          } >> "$GITHUB_ENV"
          echo "Apple signing prepared"

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} && exit 0
            echo "tauri build failed (attempt $attempt) — retrying in 90s"
            sleep 90
          done
          exit 1

      # Die .app hat Tauri bereits notarisiert und gestapelt; die DMG als Download-
      # Container zusätzlich notarisieren und stapeln, damit Gatekeeper sie ohne
      # Rückfrage öffnet.
      - name: Notarize DMG
        if: startsWith(matrix.platform, 'macos') && env.APPLE_API_KEY_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          for dmg in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            echo "notarize $dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            spctl -a -t open --context context:primary-signature -v "$dmg" || true
          done

      - name: Rename macOS updater archive per arch
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/bundle/macos
          for f in fileport.app.tar.gz fileport.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "fileport_${{ matrix.target }}.${f#fileport.}"
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fileport-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog since previous release
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
          fi
          git log $RANGE --no-merges --pretty='- %s' \
            | grep -viE '^\- (ci|chore)(\(|:)' > artifacts/CHANGELOG.txt || true
          if [ ! -s artifacts/CHANGELOG.txt ]; then
            echo "- Wartungs-Update" > artifacts/CHANGELOG.txt
          fi
          echo "Changelog ($RANGE):"
          cat artifacts/CHANGELOG.txt

      - name: Build updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cd artifacts
          find . -type f -exec mv -t . {} + 2>/dev/null || true
          python3 - "$VERSION" "$BASE" <<'EOF'
          import json, sys, glob, os, datetime
          version, base = sys.argv[1], sys.argv[2]
          notes = open("CHANGELOG.txt").read().strip()
          def find(pat):
              m = glob.glob(pat)
              return m[0] if m else None
          platforms = {}
          pairs = {
              "darwin-aarch64": find("fileport_aarch64-apple-darwin.app.tar.gz"),
              "darwin-x86_64": find("fileport_x86_64-apple-darwin.app.tar.gz"),
              "windows-x86_64": find("*-setup.exe"),
              "linux-x86_64": find("*.AppImage"),
          }
          for key, f in pairs.items():
              if not f:
                  print("WARNING: no artifact for", key); continue
              sigfile = f + ".sig"
              if not os.path.exists(sigfile):
                  print("WARNING: no signature for", f); continue
              platforms[key] = {
                  "signature": open(sigfile).read().strip(),
                  "url": f"{base}/{os.path.basename(f)}",
              }
          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      # Stabile Download-Aliase: die Website verlinkt
      # releases/latest/download/<stabiler Name> — versionsunabhängig.
      - name: Create stable-named download aliases
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          alias_cp() { src=$(ls $1 2>/dev/null | head -1 || true); [ -n "$src" ] && cp "$src" "$2" && echo "$2 <- $src" || echo "WARN: no match for $1"; }
          alias_cp '*_aarch64.dmg'        fileport-macos-arm64.dmg
          alias_cp '*_x64.dmg'            fileport-macos-intel.dmg
          alias_cp '*-setup.exe'          fileport-windows-setup.exe
          alias_cp '*_en-US.msi'          fileport-windows.msi
          alias_cp '*_amd64.deb'          fileport-linux-amd64.deb
          alias_cp '*.x86_64.rpm'         fileport-linux-x86_64.rpm
          alias_cp '*_amd64.AppImage'     fileport-linux-x86_64.AppImage

      # NICHT als prerelease publishen: der Updater-Endpoint releases/latest/
      # ignoriert Prereleases — Alpha-Status steht im README/Disclaimer.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body_path: artifacts/CHANGELOG.txt
          files: |
            artifacts/*.dmg
            artifacts/*.app.tar.gz
            artifacts/*.app.tar.gz.sig
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.exe.sig
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.AppImage.sig
            artifacts/fileport-*
            artifacts/latest.json
