[package]
name = "fileport-core"
version = "0.1.3"
description = "file/port — Protokoll-Engine: Backend-Trait, Transfers, Prüfsummen"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
blake3 = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "time", "sync", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
russh = "0.62.7"
russh-sftp = "2.4.0"
suppaftp = { version = "10.0.2", features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"
