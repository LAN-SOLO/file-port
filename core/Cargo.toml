[package]
name = "fileport-core"
version = "0.1.7"
description = "fileport — Protokoll-Engine: Backend-Trait, Transfers, Prüfsummen"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
blake3 = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "time", "sync", "net", "rt-multi-thread", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
russh = "0.62.7"
russh-sftp = "2.4.0"
# rustls statt native-tls: TLS-Session-Wiederaufnahme auf dem Datenkanal
# (vsftpd/ProFTPD/FileZilla Server verlangen sie standardmäßig). rustls,
# aws-lc-rs und rustls-platform-verifier stecken bereits über reqwest im
# Abhängigkeitsbaum — keine neuen Crates.
suppaftp = { version = "10.0.2", features = ["rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
quick-xml = "0.41.0"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
futures-util = "0.3.34"
bytes = "1.12.1"
object_store = { version = "0.14.1", features = ["aws", "azure", "gcp"] }
smb2 = "0.18.1"

[dev-dependencies]
tempfile = "3"
